<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dcae70">
  <meta name="description" content="تواصل مع WTR عبر منصات التواصل الاجتماعي">
  <title>WTR | تواصل معنا</title>
  <style>
    :root {
      --sand: #dfb474;
      --cream: #fff8e9;
      --brown: #321b10;
      --brown-soft: #5c3825;
      --accent: #a9653d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 16px 40px;
      color: var(--brown);
      background: radial-gradient(circle at 50% 0%, #f2d19b 0, var(--sand) 72%);
      font-family: Tahoma, Arial, sans-serif;
    }
    .container { width: min(100%, 540px); margin: 0 auto; }
    header { text-align: center; padding: 8px 8px 24px; }
    .logo {
      width: min(66%, 250px); aspect-ratio: 3 / 4; object-fit: cover;
      display: block; margin: 0 auto 18px; border-radius: 26px;
      border: 3px solid var(--brown); box-shadow: 0 8px 22px #59351f24;
    }
    h1 { margin: 0 0 8px; font-size: 25px; letter-spacing: 1px; }
    .subtitle { margin: 0; font-size: 15px; color: #60432e; }
    .links { display: grid; gap: 13px; }
    .link {
      min-height: 91px; display: flex; align-items: center; gap: 15px;
      padding: 16px 19px; text-decoration: none; color: var(--brown);
      background: var(--cream); border: 1px solid #754b2c20;
      border-radius: 23px; box-shadow: 0 5px 13px #4b2b171c;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .link:hover { transform: translateY(-2px); box-shadow: 0 8px 18px #4b2b1728; }
    .link.whatsapp { background: #241d18; color: #fff8e9; }
    .icon {
      width: 52px; height: 52px; flex: 0 0 52px; display: grid;
      place-items: center; border-radius: 16px;
      background: #dcae702b; color: var(--accent);
    }
    .whatsapp .icon { background: #ffffff17; color: #f0c99b; }
    .icon svg { width: 27px; height: 27px; fill: none; stroke: currentColor;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .details { min-width: 0; flex: 1; }
    .details strong { display: block; font-size: 18px; margin-bottom: 5px; }
    .details small { display: block; font-size: 13px; opacity: .72; direction: ltr; text-align: right; overflow-wrap: anywhere; }
    .arrow { font-size: 25px; opacity: .65; }
    footer { text-align: center; margin-top: 22px; color: #67472e; font-size: 12px; }
    @media (max-width: 360px) {
      .link { padding: 14px; min-height: 82px; }
      .details strong { font-size: 16px; }
      .details small { font-size: 11px; }
    }
  </style>
</head>
